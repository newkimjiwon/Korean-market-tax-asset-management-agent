[project]
name = "ktax"
version = "0.1.0"
description = "한국 세무/자산관리 에이전트용 도구 모음 (UI 없음, 순수 도구 레이어)"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2"]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ktax"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
